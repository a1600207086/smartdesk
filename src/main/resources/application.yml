spring:
  application:
    name: smartdesk
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "${SMARTDESK_DB_URL:jdbc:mysql://localhost:3306/smartdesk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${SMARTDESK_DB_USERNAME:smartdesk_app}"
    password: "${SMARTDESK_DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SmartDeskHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: "${SMARTDESK_REDIS_HOST:localhost}"
      port: "${SMARTDESK_REDIS_PORT:6379}"
      password: "${SMARTDESK_REDIS_PASSWORD:}"
      timeout: 500ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

smartdesk:
  security:
    jwt:
      issuer: smartdesk
      secret: "${SMARTDESK_JWT_SECRET:smartdesk-local-development-secret-key-2026}"
      expiration: 2h
  login-rate-limit:
    max-attempts: 5
    window: 10m
  conversation:
    recent-memory-size: 20
    memory-ttl: 1h
    default-page-size: 20
    max-page-size: 100
    context-window-size: 20
    max-context-chars: 12000
  llm:
    enabled: "${SMARTDESK_LLM_ENABLED:false}"
    base-url: "${SMARTDESK_LLM_BASE_URL:https://api.deepseek.com/v1}"
    api-key: "${SMARTDESK_LLM_API_KEY:}"
    model: "${SMARTDESK_LLM_MODEL:deepseek-chat}"
    timeout: 60s
    temperature: 0.3
    max-tokens: 1024
  knowledge:
    chunk-size: 800
    chunk-overlap: 120
    embedding-dimensions: 256
    default-top-k: 4
    max-top-k: 20
    min-score: 0.05
    cache-ttl: 10m
    max-upload-bytes: 10485760
    max-extracted-chars: 1000000
  embedding:
    enabled: "${SMARTDESK_EMBEDDING_ENABLED:false}"
    base-url: "${SMARTDESK_EMBEDDING_BASE_URL:https://api.openai.com/v1}"
    api-key: "${SMARTDESK_EMBEDDING_API_KEY:}"
    model: "${SMARTDESK_EMBEDDING_MODEL:text-embedding-3-small}"
    dimensions: "${SMARTDESK_EMBEDDING_DIMENSIONS:256}"
    timeout: 60s
    batch-size: 32

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: SmartDesk
    description: Intelligent after-sales and knowledge-base agent platform
